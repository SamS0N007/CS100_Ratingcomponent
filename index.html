<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />

    <title>Mini-Project Starter</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  </head>
  <body class="bg-light py-5">

 <div class="container my-5">

  <div class="card p-4 shadow-lg border-0 ">

    <div class="row align-items-center g-3 mb-3">
      <div class="col-12 col-md-8 ">
        <h2 class="h5 mb-1 fw-bold">What others think about the product</h2>
        <p class="text-muted small mb-0">vertified by customers</p>
      </div>


          <div class="col-12 col-md-4">
            <div class="card card-body text-center bg-light border-0">
              <div class="display-5 fw-bold mb-1">
                <i class="fa-solid fa-star text-warning fe-3 ms-1"></i>4.8
              </div>
              <small class="text-muted fw-semibold">Average Rating</small>
            </div>
          </div>

          <div class="row mt-4 g-2">
          <div class="col-12">
            <div class="input-group input-group-large">
              <span class="input-group-text bg-white border-end-0">
                <i class="fa-solid fa-magnifying-glass text-muted"></i>
              </span>
              <input 
                type="text" 
                class="form-control border-start-0 ps-0" 
                placeholder="Search Reviews" 
                aria-label="Search Reviews"
              />
            </div>
          </div>
        </div>

    <div class="row g-2 mt-3">
          
          <!-- 5 Stars -->
          <div class="col-12 d-flex align-items-center">
            <div class="text-nowrap me-3" style="width: 60px;">
              <span class="fw-semibold small">5 </span><i class="fa-solid fa-star text-warning fe-3 ms-1"></i>
            </div>
            <div class="progress flex-grow-1 me-3">
              <div class="progress-bar bg-warning" role="progressbar" style="width: 75%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <div class="text-end text-muted small" style="width: 40px;">80%</div>
          </div>

          <!-- 4 Stars -->
          <div class="col-12 d-flex align-items-center">
            <div class="text-nowrap me-3" style="width: 60px;">
              <span class="fw-semibold small">4 </span><i class="fa-solid fa-star text-warning fe-3 ms-1"></i>
            </div>
            <div class="progress flex-grow-1 me-3">
              <div class="progress-bar bg-warning" role="progressbar" style="width: 60%;" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <div class="text-end text-muted small" style="width: 40px;">60%</div>
          </div>

          <!-- 3 Stars -->
          <div class="col-12 d-flex align-items-center">
            <div class="text-nowrap me-3" style="width: 60px;">
              <span class="fw-semibold small">3 </span><i class="fa-solid fa-star text-warning fe-3 ms-1"></i>
            </div>
            <div class="progress flex-grow-1 me-3">
              <div class="progress-bar bg-warning" role="progressbar" style="width: 20%;" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <div class="text-end text-muted small" style="width: 40px;">20%</div>
          </div>

          <!-- 2 Stars -->
          <div class="col-12 d-flex align-items-center">
            <div class="text-nowrap me-3" style="width: 60px;">
              <span class="fw-semibold small">2 </span><i class="fa-solid fa-star text-warning fe-3 ms-1"></i>
            </div>
            <div class="progress flex-grow-1 me-3">
              <div class="progress-bar bg-warning" role="progressbar" style="width: 10%;" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <div class="text-end text-muted small" style="width: 40px;">10%</div>
          </div>

          <!-- 1 Stars -->
          <div class="col-12 d-flex align-items-center">
            <div class="text-nowrap me-3" style="width: 60px;">
              <span class="fw-semibold small">1 </span><i class="fa-solid fa-star text-warning fe-3 ms-1"></i>
            </div>
            <div class="progress flex-grow-1 me-3">
              <div class="progress-bar bg-warning" role="progressbar" style="width: 27%;" aria-valuenow="27" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <div class="text-end text-muted small" style="width: 40px;">27%</div>
          </div>


            <div class="row mt-4">
              <div class="col-12">
                <button type="button" class="btn btn-success rounded-pill fw-semibold px-4 py-2">
                              Write Review
                </button>
              </div>
            </div>

        </div>
      </div>
    </div>



    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
